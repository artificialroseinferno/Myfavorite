<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="bmstable" content="header.json"><meta name="viewport" content="width=device-width"><title>BMS 難易度表</title><style>body{font-family:sans-serif;max-width:1000px;margin:3em auto;padding:0 1em;background:#faf7ff;color:#453b59}table{border-collapse:collapse;width:100%}td,th{padding:.6em;border-bottom:1px solid #ddd;text-align:left}th{background:#eee5f7}</style></head><body><h1 id="name">難易度表</h1><p id="status">読み込み中…</p><table><thead><tr><th>LEVEL</th><th>TITLE</th><th>ARTIST</th><th>COMMENT</th></tr></thead><tbody id="rows"></tbody></table><script>Promise.all([fetch('header.json').then(r=>r.json()),fetch('data.json').then(r=>r.json())]).then(([h,rows])=>{document.title=h.name;document.querySelector('#name').textContent=h.name;document.querySelector('#status').textContent=rows.length+' 譜面';for(const row of rows){const tr=document.createElement('tr');for(const value of [h.symbol+row.level,row.title,row.artist,row.comment]){const td=document.createElement('td');td.textContent=value||'';tr.append(td)}document.querySelector('#rows').append(tr)}}).catch(()=>document.querySelector('#status').textContent='読み込みに失敗しました。HTTPサーバーで開いてください。');</script></body></html>
